# Every credential in this file comes from `.env` (gitignored) — see `.env.example`.
#   cp .env.example .env  &&  edit  &&  docker compose config   # validates before starting
# `${VAR:?msg}` means compose REFUSES to start when VAR is missing, rather than
# silently falling back to a well-known default password.
services:

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-report_db}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env (see .env.example)}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env (see .env.example)}
    ports:
      - "8081:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "8084:8084"
    volumes:
      - ./deployment/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"



  report-api:
    build: ./src/management_service/
    environment:
      PORT: 8000
      POSTGRES_DB: ${POSTGRES_DB:-report_db}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (see .env.example)}
      # Airtable integration (P0/Ref 42). Blank token + sync disabled is a valid
      # state: nothing calls Airtable until both are set.
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
      AIRTABLE_RESULTS_TABLE: ${AIRTABLE_RESULTS_TABLE:-tblnc9SsbXU0C0FWh}
      AIRTABLE_WRITE_ALLOWLIST: ${AIRTABLE_WRITE_ALLOWLIST:-tblnc9SsbXU0C0FWh}
      AIRTABLE_SYNC_ENABLED: ${AIRTABLE_SYNC_ENABLED:-false}
      # Separate opt-in for the production base; guide v2 keeps their processing
      # automation off until acceptance testing is signed off.
      AIRTABLE_ALLOW_PRODUCTION_WRITE: ${AIRTABLE_ALLOW_PRODUCTION_WRITE:-false}
      LABOS_PUBLIC_ORIGIN: ${LABOS_PUBLIC_ORIGIN:-}
    ports:
      - '8000:8000'
    depends_on:
      - db
    volumes:
      - ./src/management_service/alembic/versions:/app/alembic/versions
      - ./src/management_service/app:/app/app
      - ./uploads:/app/uploads
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # The sync worker — delivery plan DG6, deployment half.
  #
  # Deliberately spare, and each absence is a decision:
  #   · no `ports` — it serves nothing. Liveness is the `worker_heartbeat_at` row
  #     that report-api already exposes on GET /sync/status. A worker answering
  #     its own health check would report healthy from inside a process whose
  #     database connection had gone.
  #   · no volumes except the bind-mounted app, matching report-api, so a Python
  #     change is live without a rebuild.
  #   · no `deploy.replicas` — exactly ONE worker, and it is enforced rather than
  #     assumed: app/sync/singleton.py takes a Postgres advisory lock and a second
  #     instance exits rather than racing. Raising the replica count here does not
  #     get you two workers, it gets you one worker and one container in a crash
  #     loop, which is the intended outcome.
  #
  # It starts disabled. AIRTABLE_SYNC_ENABLED=false makes it exit cleanly with a
  # log line instead of draining a queue nobody has approved sending yet.
  sync-worker:
    build: ./src/management_service/
    command: ["python", "-m", "app.sync.service"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (see .env.example)}
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
      AIRTABLE_RESULTS_TABLE: ${AIRTABLE_RESULTS_TABLE:-tblnc9SsbXU0C0FWh}
      AIRTABLE_WRITE_ALLOWLIST: ${AIRTABLE_WRITE_ALLOWLIST:-tblnc9SsbXU0C0FWh}
      AIRTABLE_SYNC_ENABLED: ${AIRTABLE_SYNC_ENABLED:-false}
      AIRTABLE_ALLOW_PRODUCTION_WRITE: ${AIRTABLE_ALLOW_PRODUCTION_WRITE:-false}
      LABOS_PUBLIC_ORIGIN: ${LABOS_PUBLIC_ORIGIN:-}
      SYNC_LOG_LEVEL: ${SYNC_LOG_LEVEL:-INFO}
    depends_on:
      - db
    volumes:
      - ./src/management_service/app:/app/app
      # **The originals.** The worker downscales each photograph to a preview
      # before uploading it, so it needs read access to the same files the API
      # writes. Without this mount every attachment fails with "the original is
      # not readable" — the API had the volume and the worker did not, which is
      # invisible until an upload is actually attempted.
      #
      # Read-only: the worker generates previews in memory and records what it
      # delivered in the database. It has no business altering evidence.
      - ./uploads:/app/uploads:ro
    # `on-failure`, not `always`. The worker distinguishes two kinds of stop:
    #   exit 0  - deliberately off (no token, or AIRTABLE_SYNC_ENABLED=false).
    #             Valid states, so the container stops once, quietly, and the one
    #             log line explaining why stays readable.
    #   exit >0 - a real fault: no DATABASE_URL, or another instance already
    #             holds the worker slot. Worth retrying a bounded number of times.
    # `always` would restart the deliberate cases too, burying the explanation.
    restart: on-failure:5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sick_gateway-1:
    build:
      context: ./src/sick_gateway
    depends_on:
      - mosquitto
    environment:
      - SICK_API_HOST=${SICK_API_HOST_1:?set SICK_API_HOST_1 in .env (production has 1 and 2 swapped relative to the old repo defaults)}
      - SICK_API_PORT=80
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - POLL_INTERVAL=0.05
      - LOG_LEVEL=INFO
      - UNIT_OF_MEASUREMENT=inch  # Options: mm (default) or inch
    # Configure devices directly using environment variables (alternative to config file)
    # - SICK_DEVICES=device1:1:1,device2:1:2,pressure_sensor1:2:1
    volumes:
      # Mount configuration file
      - ./deployment/sick-config/config-1.json:/app/config.json
    # Mount .env file
    # - ./deployment/sick-config/.env:/app/.env
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sick_gateway-2:
    build:
      context: ./src/sick_gateway
    depends_on:
      - mosquitto
    environment:
      - SICK_API_HOST=${SICK_API_HOST_2:?set SICK_API_HOST_2 in .env (production has 1 and 2 swapped relative to the old repo defaults)}
      - SICK_API_PORT=80
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - POLL_INTERVAL=0.05
      - LOG_LEVEL=INFO
      - UNIT_OF_MEASUREMENT=inch  # Options: mm (default) or inch
    # Configure devices directly using environment variables (alternative to config file)
    # - SICK_DEVICES=device1:1:1,device2:1:2,pressure_sensor1:2:1
    volumes:
      # Mount configuration file
      - ./deployment/sick-config/config-2.json:/app/config.json
    # Mount .env file
    # - ./deployment/sick-config/.env:/app/.env
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    image: httpd:2.4
    volumes:
      - ./src/ifet_ui_react/:/usr/local/apache2/htdocs/
      - ./deployment/config/config.json:/usr/local/apache2/htdocs/config.json
      - ./deployment/config/configCommonValves.json:/usr/local/apache2/htdocs/configCommonValves.json
    ports:
      - '80:80'
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# production_service:
#   image: httpd:latest
#   ports:
#   - '80:80'
#   restart: always
#   volumes:
#   - ./legacy/production:/usr/local/apache2/htdocs
#   - ./deployment/config/config.json:/usr/local/apache2/htdocs/config.json

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
