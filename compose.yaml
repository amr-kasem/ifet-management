services:

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: report_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "8084:8084"
    volumes:
      - ./deployment/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"



  report-api:
    build: ./src/management_service/
    environment:
      PORT: 8000
      POSTGRES_DB: report_db
      DATABASE_URL: "postgresql://user:password@db:5432/report_db"
    ports:
      - '8000:8000'
    depends_on:
      - db
    volumes:
      - ./src/management_service/alembic/versions:/app/alembic/versions
      - ./src/management_service/app:/app/app
      - ./uploads:/app/uploads
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  sick_gateway-1:
    build:
      context: ./src/sick_gateway
    depends_on:
      - mosquitto
    environment:
      - SICK_API_HOST=10.1.10.85
      - SICK_API_PORT=80
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - POLL_INTERVAL=0.05
      - LOG_LEVEL=INFO
      - UNIT_OF_MEASUREMENT=inch  # Options: mm (default) or inch
    # Configure devices directly using environment variables (alternative to config file)
    # - SICK_DEVICES=device1:1:1,device2:1:2,pressure_sensor1:2:1
    volumes:
      # Mount configuration file
      - ./deployment/sick-config/config-1.json:/app/config.json
    # Mount .env file
    # - ./deployment/sick-config/.env:/app/.env
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sick_gateway-2:
    build:
      context: ./src/sick_gateway
    depends_on:
      - mosquitto
    environment:
      - SICK_API_HOST=10.1.10.229
      - SICK_API_PORT=80
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - POLL_INTERVAL=0.05
      - LOG_LEVEL=INFO
      - UNIT_OF_MEASUREMENT=inch  # Options: mm (default) or inch
    # Configure devices directly using environment variables (alternative to config file)
    # - SICK_DEVICES=device1:1:1,device2:1:2,pressure_sensor1:2:1
    volumes:
      # Mount configuration file
      - ./deployment/sick-config/config-2.json:/app/config.json
    # Mount .env file
    # - ./deployment/sick-config/.env:/app/.env
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    image: httpd:2.4
    volumes:
      - ./src/ifet_ui_react/:/usr/local/apache2/htdocs/
      - ./deployment/config/config.json:/usr/local/apache2/htdocs/config.json
      - ./deployment/config/configCommonValves.json:/usr/local/apache2/htdocs/configCommonValves.json
    ports:
      - '80:80'
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# production_service:
#   image: httpd:latest
#   ports:
#   - '80:80'
#   restart: always
#   volumes:
#   - ./legacy/production:/usr/local/apache2/htdocs
#   - ./deployment/config/config.json:/usr/local/apache2/htdocs/config.json

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
